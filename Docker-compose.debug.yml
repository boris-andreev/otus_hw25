services:
  test-server:
    image: test-server
    container_name: test-server-container
    env_file: .env
    build:
      context: .
      dockerfile: server/Dockerfile.debug
    networks:
      - test
    ports:
      - 5001:5001
      - 4000:4000

  db:
    image: postgres:18
    container_name: postgres_container
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - test

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.ru
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - test

  mongo:
    image: mongo:latest
    container_name: mongo-container
    networks:
      - test

  redis:
    image: redis:latest
    container_name: redis-container
    networks:
      - test
networks:
  test:
